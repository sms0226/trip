<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>광주 근교 반나절 나들이</title>
<style>
  :root {
    --bg: #edf4ef; --card: #ffffff; --ink: #1e293b; --sub: #64748b;
    --accent: #10b981; --accent-dark: #059669; --line: #e2e8f0; --chip: #f1f5f9;
    --ok: #10b981; --warn: #f59e0b; --food: #f43f5e;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Noto Sans KR", sans-serif; background: var(--bg); color: var(--ink); }
  .app { max-width: 480px; margin: 0 auto; min-height: 100vh; background: var(--bg); display: flex; flex-direction: column; position: relative; box-shadow: 0 0 20px rgba(0,0,0,0.05); }
  
  header.top { background: linear-gradient(135deg, #059669, #047857); color: #fff; padding: 18px 16px 14px; position: sticky; top: 0; z-index: 20; }
  header.top h1 { margin: 0 0 4px; font-size: 19px; font-weight: 800; letter-spacing: -0.5px;}
  header.top p { margin: 0; font-size: 12px; opacity: .9; font-weight: 400;}
  
  .stats { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  .stat { background: rgba(255,255,255,.2); border-radius: 8px; padding: 6px 10px; font-size: 11px; backdrop-filter: blur(4px);}
  .stat b { font-size: 13.5px; display: block; font-weight: 700;}
  
  .tabs { display: flex; background: #fff; border-bottom: 1px solid var(--line); position: sticky; top: 82px; z-index: 19; }
  .tab { flex: 1; text-align: center; padding: 12px 2px; font-size: 13px; color: var(--sub); cursor: pointer; border-bottom: 3px solid transparent; word-break: keep-all; font-weight: 500;}
  .tab.active { color: var(--accent); font-weight: 800; border-bottom-color: var(--accent); }
  
  .content { flex: 1; padding: 14px; padding-bottom: 90px; }
  
  .filters-group { margin-bottom: 12px; }
  .filters-label { font-size: 11.5px; font-weight: 700; color: var(--sub); margin: 6px 0 4px 4px; display: flex; align-items: center; gap: 4px; }
  .filters { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 6px; -webkit-overflow-scrolling: touch; }
  .filters::-webkit-scrollbar { display: none; }
  .chip { flex: 0 0 auto; background: #fff; border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; font-size: 12.5px; color: var(--sub); cursor: pointer; white-space: nowrap; transition: all 0.2s; font-weight: 500;}
  .chip.active { background: var(--ink); color: #fff; border-color: var(--ink); font-weight: 700; }
  .chip.food.active { background: var(--food); border-color: var(--food); }
  .chip.weather.active { background: #0284c7; border-color: #0284c7; }
  
  .searchbox { width: 100%; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line); margin-bottom: 12px; font-size: 14px; background: #fff; outline: none; transition: border 0.2s;}
  .searchbox:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(16,185,129,0.1);}
  
  .card { background: var(--card); border-radius: 16px; padding: 0; margin-bottom: 14px; box-shadow: 0 4px 10px rgba(0,0,0,.03); border: 1px solid var(--line); position: relative; cursor: pointer; overflow: hidden; transition: transform 0.15s; }
  .card:active { transform: scale(0.98); }
  .card-body { padding: 16px; }
  .card h3 { margin: 0 0 6px; font-size: 16px; padding-right: 30px; font-weight: 800; color: var(--ink);}
  .card .route { font-size: 12.5px; color: var(--sub); margin-bottom: 10px; line-height: 1.45; }
  
  .badge { display: inline-block; font-size: 10.5px; padding: 3px 8px; border-radius: 6px; background: var(--chip); color: var(--sub); margin-right: 4px; margin-bottom: 6px; font-weight: 700; letter-spacing: -0.2px;}
  .badge.sigun { background: #e0f2fe; color: #0369a1; }
  .badge.type { background: #ffedd5; color: #c2410c; }
  .badge.ok { background: #dcfce7; color: #15803d; }
  .badge.warn { background: #fef9c3; color: #a16207; }
  .badge.food { background: #ffe4e6; color: #be123c; }
  .badge.weather { background: #e0f2fe; color: #0284c7; }
  .badge.companion { background: #f3e8ff; color: #6b21a8; }
  .badge.day { background: #f1f5f9; color: #334155; }
  
  .meta-row { display: flex; flex-wrap: wrap; gap: 12px; font-size: 12px; color: #94a3b8; margin-top: 8px; font-weight: 500;}
  .meta-row span { display: flex; align-items: center; gap: 4px; }
  
  .heart { position: absolute; top: 12px; right: 12px; font-size: 18px; cursor: pointer; color: #cbd5e1; z-index: 10; background: rgba(255,255,255,0.95); border-radius: 50%; width: 34px; height: 34px; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 6px rgba(0,0,0,0.1); transition: transform 0.2s, color 0.2s; }
  .heart:active { transform: scale(1.2); }
  .heart.on { color: #ef4444; }
  
  .action-row { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
  .mini-btn { flex: 1; min-width: 84px; text-align: center; background: #f8fafc; border: 1px solid var(--line); border-radius: 10px; padding: 10px 6px; font-size: 12px; font-weight: 700; color: var(--ink); text-decoration: none; cursor: pointer; display: inline-block;}
  .mini-btn.kakao { background: #fee500; color: #3f3f46; border-color: #fde047; }
  .mini-btn.naver { background: #03cf5d; color: #fff; border-color: #22c55e; }
  .mini-btn.share { background: #ecfdf5; color: #059669; border-color: #a7f3d0; }
  
  .empty { text-align: center; color: var(--sub); padding: 50px 10px; font-size: 14px; line-height: 1.6; font-weight: 500;}
  
  .overlay { position: fixed; inset: 0; background: rgba(15,23,42,.6); z-index: 50; display: none; backdrop-filter: blur(3px); }
  .overlay.show { display: block; animation: fadeIn 0.2s; }
  .sheet { position: fixed; left: 50%; bottom: 0; transform: translateX(-50%) translateY(100%); width: 100%; max-width: 480px; max-height: 90vh; overflow-y: auto; background: #fff; border-radius: 24px 24px 0 0; z-index: 51; padding: 0 0 30px 0; display: block; transition: transform 0.35s cubic-bezier(0.1, 0.8, 0.2, 1); }
  .sheet.show { transform: translateX(-50%) translateY(0); }
  .sheet-content { padding: 20px 20px; }
  .sheet h2 { margin: 0 0 8px; font-size: 20px; padding-right: 30px; line-height: 1.3; font-weight: 800; color: var(--ink);}
  .sheet-close { position: absolute; top: 14px; right: 16px; width: 34px; height: 34px; border-radius: 50%; background: rgba(0,0,0,0.3); font-size: 18px; color: #fff; cursor: pointer; border: none; display: flex; align-items: center; justify-content: center; z-index: 100; backdrop-filter: blur(4px);}
  
  .sec { margin-top: 24px; }
  .sec h4 { margin: 0 0 12px; font-size: 14.5px; color: var(--accent-dark); font-weight: 800; display: flex; align-items: center; gap: 6px;}
  .sec h4::before { content: ''; display: inline-block; width: 4px; height: 14px; background: var(--accent); border-radius: 2px;}
  
  .place-mini { border: 1px solid var(--line); border-radius: 12px; padding: 14px; margin-bottom: 10px; background: #f8fafc; }
  .place-mini .pname { font-weight: 800; font-size: 14.5px; margin-bottom: 6px; color: var(--ink);}
  
  .kv { display: grid; grid-template-columns: 75px 1fr; gap: 8px 10px; font-size: 12.5px; color: var(--sub); margin-top: 10px; }
  .kv b { color: var(--ink); font-weight: 600; word-break: keep-all; line-height: 1.5; }
  
  .foodcard { border: 1px solid var(--line); border-radius: 12px; padding: 14px; margin-bottom: 10px; background: #fff1f2; }
  
  .acc { border: 1px solid var(--line); border-radius: 12px; margin-top: 16px; overflow: hidden; background: #fff; }
  .acc summary { padding: 14px; font-size: 13px; color: var(--ink); cursor: pointer; list-style: none; font-weight: 700; background: #f8fafc;}
  .acc summary::-webkit-details-marker { display: none; }
  .acc .acc-body { padding: 12px 14px; font-size: 12px; color: var(--sub); line-height: 1.6; }
  
  .notice { background: #fffbeb; border: 1px solid #fde68a; color: #92400e; font-size: 12.5px; padding: 12px; border-radius: 12px; margin-bottom: 14px; line-height: 1.5; font-weight: 500;}
  
  .toast { position: fixed; left: 50%; bottom: 30px; transform: translateX(-50%) translateY(20px); background: rgba(15,23,42,0.95); color: #fff; padding: 12px 24px; border-radius: 999px; font-size: 13.5px; font-weight: 600; z-index: 100; opacity: 0; pointer-events: none; transition: all 0.3s cubic-bezier(0.1, 0.8, 0.2, 1); box-shadow: 0 10px 25px rgba(0,0,0,0.2); }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  a { color: inherit; text-decoration: none;}

  .curation-box { background: linear-gradient(135deg, #f0fdf4, #ecfdf5); border: 1px solid #a7f3d0; border-radius: 16px; padding: 20px; margin-bottom: 16px; box-shadow: 0 4px 15px rgba(16,185,129,0.1); }

  .curation-box p { margin: 0 0 16px; font-size: 13px; color: #334155; line-height: 1.5; word-break: keep-all; }
  .curation-sel-row { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
  .curation-sel { flex: 1; min-width: 110px; padding: 12px 14px; border-radius: 12px; border: 1px solid #6ee7b7; font-size: 13.5px; background: #fff; outline: none; color: var(--ink); font-weight: 600; }
  .btn-curate { width: 100%; background: var(--accent-dark); color: #fff; border: none; border-radius: 14px; padding: 16px; font-size: 15px; font-weight: 800; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; transition: background .2s; box-shadow: 0 4px 12px rgba(5,150,105,0.3);}
  .btn-curate:active { background: #047857; }
  
  .curate-result { background: #fff; border: 2px solid #6ee7b7; border-radius: 16px; padding: 20px; margin-top: 16px; display: none; }
  .curate-result.show { display: block; animation: fadeIn .4s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

  .nav-btn-group { display: flex; gap: 8px; margin-top: 14px; }
  .nav-btn { flex: 1; text-align: center; padding: 12px 8px; border-radius: 12px; font-size: 13px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 6px; }
  .nav-btn.kakao { background: #fee500; color: #191919; border: 1px solid #fde047; }
  .nav-btn.naver { background: #03cf5d; color: #fff; border: 1px solid #22c55e; }

  /* SVG 비주얼 & 애니메이션 */
  .svg-visual { width: 100%; height: 140px; overflow: hidden; position: relative; display: block; background: #ccc;}
  .svg-visual svg { width: 100%; height: 100%; display: block; object-fit: cover; }
  
  @keyframes sway { 0%, 100% { transform: rotate(0deg); transform-origin: bottom center; } 50% { transform: rotate(2deg); transform-origin: bottom center; } }
  @keyframes twinkle { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }
  @keyframes cloudMove { 0% { transform: translateX(0); } 100% { transform: translateX(100px); } }
</style>

  if(document.getElementById('sheet').classList.contains('show')) {
      if(type === 'course') openCourseSheet(id);
      else if(type === 'place') openPlaceSheet(id);
  }
}

function toast(msg) { 
  const t = document.getElementById('toast'); 
  t.textContent = msg; 
  t.classList.add('show'); 
  setTimeout(() => t.classList.remove('show'), 2200); 
}

function mapLinks(name, address) {
  const q = encodeURIComponent((name || '') + ' ' + (address || ''));
  return { 
    kakao: 'https://map.kakao.com/link/search/' + q, 
    naver: 'https://map.naver.com/v5/search/' + q 
  };
}

function shareItem(title, text, url) {
  const payload = title + '\n' + text + '\n' + url;
  if(navigator.share) { 
    navigator.share({title, text, url}).catch(() => { copyFallback(payload); }); 
  } else {
    copyFallback(payload);
  }
}

function copyFallback(text) {
  const textarea = document.createElement('textarea');
  textarea.value = text;
  textarea.style.position = 'fixed';
  document.body.appendChild(textarea);
  textarea.select();
  try {
    document.execCommand('copy');
    toast('공유 링크가 복사되었습니다 📋');
  } catch (e) {
    toast('공유를 지원하지 않는 기기입니다');
  }
  document.body.removeChild(textarea);
}

function hourLabel(hrs) { 
  if(hrs == null) return '-'; 
  const h = Math.floor(hrs); 
  const m = Math.round((hrs - h) * 60); 
  return m > 0 ? h + '시간 ' + m + '분' : h + '시간'; 
}

function won(n) { 
  if(n == null || n === '') return '정보 없음'; 
  if(n === 0) return '무료';
  return Number(n).toLocaleString() + '원'; 
}

/* 동적 SVG 비주얼 생성 */

    let theme = 'forest';
    if (type === 'food') {
        theme = 'food';
    } else if (type === 'course') {
        theme = 'course';

        const n = item.name || '';
        const c = item.type || '';
        const d = item.desc || '';
        if (n.includes('호수') || n.includes('강') || n.includes('돛배') || n.includes('지') || n.includes('적벽') || n.includes('아쿠아나')) theme = 'water';
        else if (c.includes('역사') || c.includes('문화') || c.includes('마을')) theme = 'history';

          <h3>🍚 ${fd.name}</h3>
          <div class="route" style="color:var(--food); font-weight:700;">대표메뉴: ${fd.menu}</div>
          <div><span class="badge sigun">${fd.sigun}</span> <span class="badge" style="background:#f1f5f9; color:#475569;">${fd.note}</span></div>
          <div class="meta-row" style="margin-top:12px;"><span>📍 ${fd.address}</span></div>
          <div class="meta-row">
            <span>🕒 ${fd.hours} (휴무: ${fd.closed})</span>
          </div>
          ${fd.phone ? `<div class="meta-row"><span>📞 ${fd.phone}</span></div>` : ''}
          <div class="action-row">
            <a class="mini-btn kakao" href="${fm.kakao}" target="_blank">📍 카카오맵</a>
            <a class="mini-btn naver" href="${fm.naver}" target="_blank">🗺 네이버맵</a>
          </div>
        </div>
      </div>`;
    }).join('');
  }
  return html;
}

/* 4. 찜목록 탭 */
function renderLikeTab() {
  const lc = COURSES.filter(c => isLiked('course', c.id));
  const lp = PLACES.filter(p => isLiked('place', p.id));
  const lf = FOODS.filter(f => isLiked('food', f.id));
  
  if(lc.length === 0 && lp.length === 0 && lf.length === 0) {
      return `
      <div class="empty" style="padding-top: 80px;">
        <div style="font-size: 44px; margin-bottom: 12px; color:#cbd5e1;">♥</div>
        아직 찜한 나들이 항목이 없네요!<br>마음에 드는 카드의 하트를 탭해보세요.
      </div>`;
  }
  
  let html = '';
  if(lc.length) { 
      html += `<h4 style="color:var(--accent-dark); font-size:16px; margin: 10px 0; font-weight:800;">🚗 내가 찜한 코스</h4>` + lc.map(c => `
      <div class="card" data-open="course" data-id="${c.id}" style="border-left: 4px solid var(--accent);">
        <span class="heart on" data-like="course" data-id="${c.id}">♥</span>
        <div class="card-body" style="padding: 14px;">
          <h3 style="margin-bottom:6px;">${c.name}</h3>
          <span class="badge sigun">${c.sigun}</span><span class="badge type">${c.companion}</span>
          <div style="font-size:11.5px; color:#64748b; margin-top:8px;">${c.route}</div>
        </div>
      </div>`).join(''); 
  }
  if(lp.length) { 
      html += `<h4 style="color:var(--accent-dark); font-size:16px; margin: 24px 0 10px; font-weight:800;">📍 내가 찜한 명소</h4>` + lp.map(p => `
      <div class="card" data-open="place" data-id="${p.id}" style="border-left: 4px solid var(--ok);">
        <span class="heart on" data-like="place" data-id="${p.id}">♥</span>
        <div class="card-body" style="padding: 14px;">
          <h3 style="margin-bottom:6px;">${p.name}</h3>
          <span class="badge sigun">${p.sigun}</span><span class="badge type">${p.type}</span>
        </div>
      </div>`).join(''); 
  }
  if(lf.length) { 
      html += `<h4 style="color:var(--accent-dark); font-size:16px; margin: 24px 0 10px; font-weight:800;">🍚 내가 찜한 맛집</h4>` + lf.map(f => {
      const fm = mapLinks(f.name, f.address);
      return `
      <div class="card" style="border-left: 4px solid var(--food);">
        <span class="heart on" data-like="food" data-id="${f.id}">♥</span>
        <div class="card-body" style="padding: 14px;">
          <h3 style="margin-bottom:6px;">${f.name}</h3>
          <div style="font-size:12px; font-weight:700; color:var(--food); margin-bottom:8px;">${f.menu}</div>
          <span class="badge sigun">${f.sigun}</span>
          <div class="action-row" style="margin-top:12px;"><a class="mini-btn kakao" href="${fm.kakao}" target="_blank">📍 지도 보기</a></div>
        </div>
      </div>`}).join(''); 
  }
  return html;
}

function openSheet() { 
  document.getElementById('overlay').classList.add('show'); 
  document.getElementById('sheet').classList.add('show'); 
}
function closeSheet() { 
  document.getElementById('overlay').classList.remove('show'); 
  document.getElementById('sheet').classList.remove('show'); 
}

/* 5. AI 스마트 큐레이션 */
function renderCurationTab() {
  return `
  <div class="curation-box">
    <h3>🎲 AI 스마트 큐레이션 엔진</h3>
    <p>어디로 갈지 고민이신가요? 조건에 딱 맞는 맞춤형 코스를 즉시 뽑아드립니다!</p>
    
    <div class="curation-sel-row">
      <select class="curation-sel" id="curSigun">
        <option value="ALL">📍 지역 무관</option>
        <option value="담양">담양군</option>
        <option value="화순">화순군</option>
        <option value="나주">나주시</option>
        <option value="장성">장성군</option>
      </select>
      
      <select class="curation-sel" id="curComp">
        <option value="ALL">👥 동행 무관</option>
        <option value="연인·친구">💑 연인·친구</option>
        <option value="아이 동반">👨‍👩‍👧‍👦 아이 동반</option>
        <option value="부모님 동반">👵 부모님 모시고</option>
      </select>
    </div>
    
    <button class="btn-curate" onclick="runSmartCuration()">✨ 최적의 나들이 코스 뽑기</button>
    <div class="curate-result" id="curateResult"></div>
  </div>`;
}

function runSmartCuration() {
  var sigun = document.getElementById('curSigun').value;
  var comp = document.getElementById('curComp').value;
  
  var filtered = COURSES.filter(c => {
    var mSigun = (sigun === 'ALL' || c.sigun === sigun);
    var mComp = (comp === 'ALL' || (c.companion && c.companion.includes(comp)));
    return mSigun && mComp;
  });
  
  var resBox = document.getElementById('curateResult');
  resBox.className = 'curate-result show';

  if (filtered.length === 0) {
    resBox.innerHTML = '<div style="text-align:center; padding:24px 10px; color:#64748b; font-weight:500;">조건에 꼭 맞는 코스가 없습니다.<br>지역이나 동행 조건을 조금 넓혀서 다시 뽑아주세요!</div>';
    return;
  }
  
  var picked = filtered[Math.floor(Math.random() * filtered.length)];
  var startPlace = placeById[picked.placeIds[0]] || {};
  var navs = mapLinks(picked.name, startPlace.address);

  resBox.innerHTML = `
    <div style="font-size:12.5px; color:var(--accent-dark); font-weight:800; margin-bottom:6px;">🎯 오늘의 추천 코스 당첨!</div>
    <h3 style="margin:0 0 8px; font-size:18px; color:var(--ink); font-weight:800;">${picked.name}</h3>
    <div style="margin-bottom:12px;">
      <span class="badge sigun">${picked.sigun}</span>
      <span class="badge type">${picked.companion}</span>
      <span style="font-size:11.5px; color:#64748b; margin-left:6px; font-weight:600;">⏱ ${hourLabel(picked.totalHours)}</span>
    </div>
    <div style="background:#f8fafc; padding:14px; border-radius:12px; font-size:13px; color:#334155; line-height:1.5; margin-bottom:14px; font-weight:500; border:1px solid #e2e8f0;">
      💬 ${picked.memo}
    </div>
    <div style="font-size:12.5px; color:#64748b; margin-bottom:10px; font-weight:600; padding-left:4px;">📍 ${picked.route}</div>
    <div class="nav-btn-group">
      <button class="nav-btn" style="background:#fff; border:1px solid #cbd5e1; color:#334155;" onclick="openCourseSheet('${picked.id}')">📝 코스 상세 보기</button>
      <a class="nav-btn kakao" href="${navs.kakao}" target="_blank">📍 시작점 길찾기</a>
    </div>
  `;
}

function render() {
  renderStats();
  const c = document.getElementById('content');
  if(state.tab === 'course') c.innerHTML = renderCourseTab() + sourceAccordion();
  else if(state.tab === 'place') c.innerHTML = renderPlaceTab() + sourceAccordion();
  else if(state.tab === 'food') c.innerHTML = renderFoodTab() + sourceAccordion();
  else if(state.tab === 'curation') c.innerHTML = renderCurationTab();
  else c.innerHTML = renderLikeTab();

  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === state.tab));

  c.querySelectorAll('[data-open]').forEach(el => {
    el.addEventListener('click', (e) => {
      if(e.target.closest('.heart') || e.target.closest('.mini-btn')) return;
      if(el.dataset.open === 'course') openCourseSheet(el.dataset.id); 
      else openPlaceSheet(el.dataset.id);
    });
  });
  
  c.querySelectorAll('[data-like]').forEach(el => {
    el.addEventListener('click', (ev) => toggleLike(el.dataset.like, el.dataset.id, ev));
  });
  
  c.querySelectorAll('[data-act]').forEach(el => {
    el.addEventListener('click', () => {
      const act = el.dataset.act, val = el.dataset.val;
      state[act] = val;
      render();
    });
  });
  
  const psi = document.getElementById('placeSearchInput');
  if(psi) psi.addEventListener('input', e => { state.placeSearch = e.target.value; render(); psi.focus(); psi.setSelectionRange(psi.value.length,psi.value.length); });
  const fsi = document.getElementById('foodSearchInput');
  if(fsi) fsi.addEventListener('input', e => { state.foodSearch = e.target.value; render(); fsi.focus(); fsi.setSelectionRange(fsi.value.length,fsi.value.length); });
}

document.querySelectorAll('.tab').forEach(t => { 
  t.addEventListener('click', () => { 
    state.tab = t.dataset.tab; 
    render(); 
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }); 
});

document.getElementById('overlay').addEventListener('click', closeSheet);
document.addEventListener('click', e => { if(e.target.closest && e.target.closest('.sheet-close')) closeSheet(); });

render();
</script>
</body>
</html>
